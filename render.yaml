services:
  - type: web
    name: loveflix
    runtime: python
    plan: starter
    buildCommand: python -m compileall -q backend
    startCommand: python backend/server.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data/loveflix
    disk:
      name: loveflix-data
      mountPath: /var/data
      sizeGB: 1
