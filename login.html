<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Log in — LoveFlix</title><link rel="stylesheet" href="login.css"><script src="auth.js" defer></script></head>
<body><div class="background"></div><header><a href="/?signup" class="logo">LOVEFLIX</a></header>
<main class="login-container"><section class="login-box" aria-labelledby="account-title"><h1 id="account-title">Log in</h1>
<form id="account-form">
<div class="input-group" hidden><label for="account-name">Full name</label><input id="account-name" name="name" autocomplete="name" maxlength="100" disabled></div>
<div class="input-group" hidden><label for="account-email">Email address</label><input id="account-email" name="email" type="email" autocomplete="email" maxlength="254" disabled></div>
<div class="input-group" hidden><label for="account-phone">Phone number</label><input id="account-phone" name="phone" type="tel" autocomplete="tel" placeholder="+977 …" maxlength="30" disabled></div>
<div class="input-group"><label for="account-identity">Email or existing username</label><input id="account-identity" name="identity" autocomplete="username" maxlength="254" required></div>
<div class="input-group"><label for="login-password">Password</label><div class="password-field"><input id="login-password" name="password" type="password" autocomplete="current-password" maxlength="200" required><button class="password-toggle" type="button" aria-controls="login-password" aria-label="Show password" aria-pressed="false">Show</button></div></div>
<div class="input-group" hidden><label for="confirm-password">Confirm password</label><div class="password-field"><input id="confirm-password" name="confirm" type="password" autocomplete="new-password" maxlength="200" disabled><button class="password-toggle" type="button" aria-controls="confirm-password" aria-label="Show password" aria-pressed="false">Show</button></div></div>
<p id="account-status" role="status" aria-live="polite"></p><button id="account-submit" class="login-btn" type="submit">Log in</button>
<div class="options"><label id="remember-row"><input name="remember" type="checkbox"> Remember me</label><a id="forgot-link" href="login.html?mode=forgot">Forgot password?</a></div>
<div class="signup"><a id="login-link" href="login.html" hidden>Already have an account? Log in</a><a id="register-link" href="login.html?mode=register">New here? Create account</a></div>
<p id="register-note" class="note" hidden>Use at least 10 characters for your password. Your name, email, and phone number stay private. Accounts share this site’s memories and editing access.</p>
<noscript><p class="note">Please enable JavaScript to create an account or log in.</p></noscript>
</form></section></main></body></html>
