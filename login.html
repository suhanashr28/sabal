<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoveFlix - Login</title>
    <link rel="stylesheet" href="login.css">
<script src="photo-lightbox.js" defer></script><link rel="stylesheet" href="loveflix.css"><script src="loveflix.js" defer></script></head>
<body>

    <div class="background"></div>

    <header>
        <h1 class="logo">LOVEFLIX</h1>
    </header>

    <div class="login-container">
        <div class="login-box">
            <h2>Sign In</h2>

            <form action="profile.html" method="get">
                <div class="input-group">
                    <input type="text" placeholder="Email or Username" required>
                </div>

                <div class="input-group">
                    <input type="password" placeholder="Password" required>
                </div>

                <button type="submit" class="login-btn">
                    Sign In
                </button>

                <div class="options">
                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="mailto:loveflix@example.com">Need help?</a>
                </div>

                <div class="signup">
                    New to LoveFlix?
                    <a href="profile.html">Start watching.</a>
                </div>

                <p class="note">
                    This page is protected and designed specially for someone very important ❤️
                </p>
            </form>
        </div>
    </div>

</body>
</html>
