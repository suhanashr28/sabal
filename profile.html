<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LoveFlix — Choose a profile</title>
  <link rel="stylesheet" href="profile.css">
<script src="photo-lightbox.js" defer></script><link rel="stylesheet" href="loveflix.css"><script src="loveflix.js" defer></script></head>
<body>
  <main class="container">
    <div class="brand">LOVEFLIX</div>
    <h1>Who's watching?</h1>
    <p class="subtitle">Choose a profile to continue our story.</p>

    <div class="profiles">
      <a href="home.html?profile=my" class="profile-card" aria-label="Open My Profile">
        <div class="avatar avatar-my"><span>M</span></div>
        <span>My Profile</span>
      </a>
      <a href="home.html?profile=sabal" class="profile-card sabal" aria-label="Open Sabal's profile">
        <div class="avatar avatar-sabal"><span>S</span></div>
        <span>Sabal</span>
      </a>
    </div>
    <p class="hint">Made with all my love, for us ♡</p>
  </main>
</body>
</html>
