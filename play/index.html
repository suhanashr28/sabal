<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>Happy Birthday Baby — LoveFlix</title><link rel="stylesheet" href="player.css"><script src="player.js" defer></script></head>
<body>
<main id="player" aria-label="Happy Birthday Baby movie player">
 <video id="movie" playsinline preload="auto" aria-label="Happy Birthday Baby" src="/media/play-movie"></video>
 <header class="chrome"><a href="../home.html" aria-label="Back to Home">←</a><div><span class="brand">LOVEFLIX ORIGINAL</span><h1>Happy Birthday Baby</h1></div></header>
 <button id="center-play" class="center" aria-label="Play movie">▶</button>
 <p id="status" role="status"></p>
 <footer class="chrome">
  <div class="timeline"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Seek through movie"><span id="duration">0:00</span></div>
  <div class="controls"><button id="toggle" aria-label="Play">▶</button><button id="back" aria-label="Rewind 10 seconds">↶<small>10</small></button><button id="forward" aria-label="Forward 10 seconds">↷<small>10</small></button><button id="mute" aria-label="Mute">♪</button><span class="movie-title">Happy Birthday Baby</span><button id="fullscreen" aria-label="Enter fullscreen">⛶</button></div>
 </footer>
</main>
</body></html>
